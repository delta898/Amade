services:
  amade:
    image: ${AMADE_IMAGE:-ghcr.io/delta898/amade:0.1.0-rc.1}
    working_dir: /workspace
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - type: bind
        source: .
        target: /workspace

  # Remote authentication is isolated from ordinary build/preview commands.
  amade-auth:
    image: ${AMADE_IMAGE:-ghcr.io/delta898/amade:0.1.0-rc.1}
    working_dir: /workspace
    environment:
      AMADE_AUTH_STORE: docker-volume
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: amade-auth
        target: /root/.config/.wrangler

volumes:
  amade-auth:
