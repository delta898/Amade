<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">Studio Journal template preview</title><desc id="desc">A warm, editorial studio homepage with service and journal sections.</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbfaf6"/><stop offset="1" stop-color="#f1ede4"/></linearGradient><radialGradient id="art" cx="38%" cy="34%"><stop stop-color="#e7c9a8"/><stop offset=".3" stop-color="#d99e7b"/><stop offset=".62" stop-color="#ae6855"/><stop offset="1" stop-color="#3e4541"/></radialGradient></defs><rect width="1200" height="860" rx="28" fill="#272923"/><rect x="18" y="18" width="1164" height="824" rx="20" fill="url(#paper)"/><path d="M70 100H1130" stroke="#d9d6ce"/><circle cx="89" cy="61" r="13" fill="#272923"/><text x="117" y="69" fill="#272923" font-family="Arial,sans-serif" font-size="24" font-weight="700">스튜디오</text><g fill="#666b61" font-family="Arial,sans-serif" font-size="15"><text x="742" y="67">소개</text><text x="824" y="67">서비스</text><text x="922" y="67">이야기</text><text x="1012" y="67">문의</text></g><text x="90" y="180" fill="#777a71" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">●  INDEPENDENT STUDIO</text><text x="88" y="280" fill="#272923" font-family="Arial,sans-serif" font-size="58" font-weight="500">좋은 생각을</text><text x="88" y="353" fill="#b9684b" font-family="Arial,sans-serif" font-size="58">쓸모 있는 경험으로.</text><text x="91" y="405" fill="#71756c" font-family="Arial,sans-serif" font-size="18">브랜드의 방향을 찾고, 사람들에게 닿는</text><text x="91" y="435" fill="#71756c" font-family="Arial,sans-serif" font-size="18">웹사이트와 콘텐츠를 만듭니다.</text><rect x="92" y="486" width="190" height="48" rx="4" fill="#272923"/><text x="116" y="516" fill="#f4f1ea" font-family="Arial,sans-serif" font-size="14">스튜디오 알아보기 ↓</text><circle cx="899" cy="323" r="176" fill="url(#art)"/><ellipse cx="899" cy="320" rx="210" ry="64" fill="none" stroke="#fff9ec" stroke-opacity=".6" transform="rotate(-26 899 320)"/><ellipse cx="899" cy="320" rx="70" ry="207" fill="none" stroke="#fff9ec" stroke-opacity=".5" transform="rotate(30 899 320)"/><circle cx="899" cy="303" r="56" fill="#e7b17c"/><path d="M70 592H1130" stroke="#d9d6ce"/><text x="90" y="632" fill="#b9684b" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">01  ABOUT</text><text x="340" y="650" fill="#272923" font-family="Arial,sans-serif" font-size="31">작은 질문에서 시작해 오래 쓰일 답을 만듭니다.</text><text x="90" y="728" fill="#b9684b" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">02  WHAT WE DO</text><text x="340" y="730" fill="#272923" font-family="Arial,sans-serif" font-size="23">브랜드 전략　　웹사이트　　콘텐츠</text><path d="M70 775H1130" stroke="#d9d6ce"/><text x="90" y="810" fill="#777a71" font-family="Arial,sans-serif" font-size="12">JOURNAL  ·  이야기를 기록하고 나눕니다.</text><text x="1055" y="810" fill="#777a71" font-family="Arial,sans-serif" font-size="12">© 2026</text></svg>
